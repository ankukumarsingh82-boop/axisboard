<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AxisBoard</title>
<style>body{font-family:system-ui,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;background:#0f172a;color:#e2e8f0}input,select,textarea,button{font:inherit;padding:.5rem;border-radius:6px;border:1px solid #334155;background:#1e293b;color:#e2e8f0}button{background:#6366f1;border:0;cursor:pointer}.card{background:#1e293b;padding:1rem;border-radius:10px;margin:1rem 0}li{margin:.3rem 0}.done{text-decoration:line-through;opacity:.6}pre{white-space:pre-wrap;background:#020617;padding:1rem;border-radius:8px}.banner{background:#422006;color:#fde68a;padding:.6rem;border-radius:8px}</style></head><body>
<div class="banner">Prep scaffold for CodeAxis Hackathon — final build happens in the official window (from 20 Oct 2026).</div>
<h1>AxisBoard</h1><p>Multi-track project dashboard: pick a track, log milestones, attach a demo URL, export a one-page submission brief.</p>
<div class="card"><label>Project name <input id="name"></label><br><br><label>Track <select id="track"><option>Open Innovation</option><option>AI / ML</option><option>FinTech</option><option>HealthTech</option><option>EdTech</option><option>Sustainability</option></select></label><br><br><label>Problem statement<br><textarea id="problem" rows="3" style="width:100%"></textarea></label><br><label>Live demo URL <input id="demo" style="width:60%"></label></div>
<div class="card"><h3>Milestones <span id="prog"></span></h3><input id="ms" placeholder="e.g. Auth working"> <button id="add">Add</button><ul id="list"></ul></div>
<div class="card"><button id="exp">Generate brief</button> <button id="dl">Download .md</button> <button id="reset" style="background:#475569">Reset</button><pre id="brief"></pre></div>
<script src="app.js"></script></body></html>
